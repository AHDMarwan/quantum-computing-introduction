name: Fix GitHub math delimiters

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-math:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert LaTeX delimiters for GitHub Markdown
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = []
          for path in Path('.').rglob('*.md'):
              text = path.read_text(encoding='utf-8')
              new = text.replace(r'\[', '$$').replace(r'\]', '$$')
              new = new.replace(r'\(', '$').replace(r'\)', '$')
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          print(f'Changed {len(changed)} Markdown files')
          for path in changed:
              print(path)
          PY

      - name: Commit converted Markdown
        shell: bash
        run: |
          if git diff --quiet -- '*.md'; then
            echo 'No Markdown changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.md'
          git commit -m 'Fix GitHub math rendering'
          git push
