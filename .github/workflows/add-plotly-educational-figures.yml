name: Add Plotly educational figures

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Plotly export dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy plotly kaleido
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            python - <<'PY'
          import plotly.io as pio
          pio.get_chrome()
          PY
          fi

      - name: Generate Plotly figures and insert them into chapters
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import plotly.graph_objects as go
          from plotly.subplots import make_subplots

          root = Path('.')
          figdir = root / 'assets' / 'figures'
          htmldir = root / 'assets' / 'interactive'
          figdir.mkdir(parents=True, exist_ok=True)
          htmldir.mkdir(parents=True, exist_ok=True)

          def save(fig, name, width=1000, height=700):
              fig.update_layout(width=width, height=height, margin=dict(l=60, r=60, t=90, b=60))
              fig.write_image(figdir / f'{name}.png', width=width, height=height, scale=1.6)
              fig.write_html(
                  htmldir / f'{name}.html',
                  include_plotlyjs='cdn',
                  full_html=True,
                  config={'displayModeBar': True, 'responsive': True},
              )

          def sphere(opacity=0.12):
              u = np.linspace(0, 2*np.pi, 60)
              v = np.linspace(0, np.pi, 35)
              x = np.outer(np.cos(u), np.sin(v))
              y = np.outer(np.sin(u), np.sin(v))
              z = np.outer(np.ones_like(u), np.cos(v))
              return go.Surface(x=x, y=y, z=z, opacity=opacity, showscale=False, hoverinfo='skip')

          # 1. Bloch sphere: representative pure state.
          r = np.array([2/3, 2/3, -1/3])
          fig = go.Figure([sphere()])
          for end, label in [((1.15,0,0),'X'), ((0,1.15,0),'Y'), ((0,0,1.15),'Z')]:
              fig.add_trace(go.Scatter3d(
                  x=[0,end[0]], y=[0,end[1]], z=[0,end[2]],
                  mode='lines+text', text=['',label], textposition='top center', showlegend=False
              ))
          fig.add_trace(go.Scatter3d(
              x=[0,r[0]], y=[0,r[1]], z=[0,r[2]],
              mode='lines+markers+text', text=['','|ψ⟩'], textposition='top center', name='state'
          ))
          fig.update_layout(
              title='Bloch sphere: a pure qubit state',
              scene=dict(aspectmode='cube', xaxis_title='x = ⟨X⟩', yaxis_title='y = ⟨Y⟩', zaxis_title='z = ⟨Z⟩')
          )
          save(fig, 'bloch-sphere-state', 950, 760)

          # 2. Bloch ball: pure, mixed, maximally mixed.
          pure = np.array([0.72, -0.32, 0.6164414])
          pure = pure / np.linalg.norm(pure)
          mixed = 0.45 * pure
          fig = go.Figure([sphere(0.09)])
          for vec, name in [(pure, 'pure state ‖r‖=1'), (mixed, 'mixed state ‖r‖<1')]:
              fig.add_trace(go.Scatter3d(
                  x=[0,vec[0]], y=[0,vec[1]], z=[0,vec[2]], mode='lines+markers', name=name
              ))
          fig.add_trace(go.Scatter3d(
              x=[0], y=[0], z=[0], mode='markers+text', text=['I/2'], textposition='top center', name='maximally mixed'
          ))
          fig.update_layout(
              title='Bloch ball: pure and mixed one-qubit states',
              scene=dict(aspectmode='cube', xaxis_title='⟨X⟩', yaxis_title='⟨Y⟩', zaxis_title='⟨Z⟩')
          )
          save(fig, 'bloch-ball-pure-mixed', 950, 760)

          # 3. Measurement directions.
          state = np.array([0.55, 0.45, 0.703562])
          state = state / np.linalg.norm(state)
          fig = go.Figure([sphere(0.07)])
          for a, b, label in [((-1,0,0),(1,0,0),'X basis'), ((0,0,-1),(0,0,1),'Z basis')]:
              fig.add_trace(go.Scatter3d(x=[a[0],b[0]], y=[a[1],b[1]], z=[a[2],b[2]], mode='lines', name=label))
          fig.add_trace(go.Scatter3d(
              x=[0,state[0]], y=[0,state[1]], z=[0,state[2]], mode='lines+markers', name='state r'
          ))
          fig.update_layout(
              title='Measurement bases as directions on the Bloch sphere',
              scene=dict(aspectmode='cube', xaxis_title='X', yaxis_title='Y', zaxis_title='Z')
          )
          save(fig, 'measurement-bases-bloch', 950, 760)

          # 4. Tensor-product basis.
          xs = [0,1,0,1]
          ys = [0,0,1,1]
          labels = ['|00⟩','|01⟩','|10⟩','|11⟩']
          fig = go.Figure(go.Scatter(
              x=xs, y=ys, mode='markers+text', text=labels, textposition='top center', marker=dict(size=18)
          ))
          fig.update_layout(
              title='Two-qubit computational basis from the tensor product',
              xaxis=dict(title='Qubit B basis value', tickmode='array', tickvals=[0,1], ticktext=['0','1'], range=[-.35,1.35]),
              yaxis=dict(title='Qubit A basis value', tickmode='array', tickvals=[0,1], ticktext=['0','1'], range=[-.35,1.35]),
              showlegend=False,
          )
          save(fig, 'tensor-product-basis', 850, 620)

          # 5. Classical correlation versus Bell entanglement.
          z_corr = np.array([[.5,0],[0,.5]])
          x_class = np.full((2,2), .25)
          x_bell = np.array([[.5,0],[0,.5]])
          fig = make_subplots(
              rows=2, cols=2,
              subplot_titles=(
                  'Classical mixture: Z basis', 'Bell |Φ+⟩: Z basis',
                  'Classical mixture: X basis', 'Bell |Φ+⟩: X basis'
              ),
              vertical_spacing=.18, horizontal_spacing=.12,
          )
          for rr, cc, data in [(1,1,z_corr),(1,2,z_corr),(2,1,x_class),(2,2,x_bell)]:
              fig.add_trace(go.Heatmap(
                  z=data, x=['0 / +','1 / −'], y=['0 / +','1 / −'],
                  zmin=0, zmax=.5, showscale=False,
                  text=np.round(data,2), texttemplate='%{text}', hovertemplate='P=%{z:.2f}<extra></extra>'
              ), rr, cc)
          fig.update_layout(title='Classical correlation and Bell entanglement: the measurement basis matters')
          save(fig, 'bell-correlations', 1000, 820)

          # 6. Grover rotation.
          theta = np.arcsin(0.25)  # M/N = 1/16
          angles = np.linspace(0, np.pi/2, 240)
          x = np.cos(angles)
          y = np.sin(angles)
          start = np.array([np.cos(theta), np.sin(theta)])
          after = np.array([np.cos(3*theta), np.sin(3*theta)])
          fig = go.Figure()
          fig.add_trace(go.Scatter(x=x, y=y, mode='lines', name='unit circle'))
          fig.add_trace(go.Scatter(x=[0,start[0]], y=[0,start[1]], mode='lines+markers', name='initial |s⟩'))
          fig.add_trace(go.Scatter(x=[0,after[0]], y=[0,after[1]], mode='lines+markers', name='after one Grover iterate'))
          fig.add_annotation(x=.55, y=.27, text='rotation by 2θ', showarrow=True, ax=-45, ay=-45)
          fig.update_layout(
              title='Grover iteration as a rotation in the {|B⟩, |G⟩} plane',
              xaxis=dict(title='bad-state amplitude |B⟩', range=[0,1.08], scaleanchor='y', scaleratio=1),
              yaxis=dict(title='good-state amplitude |G⟩', range=[0,1.08]),
          )
          save(fig, 'grover-rotation', 900, 720)

          # 7. QPE distribution for a non-exact phase.
          phi = 0.34
          m = 4
          M = 2**m
          outcomes = np.arange(M)
          probs = []
          for j in outcomes:
              delta = phi - j/M
              vals = np.exp(2j*np.pi*np.arange(M)*delta)
              probs.append(abs(vals.mean())**2)
          probs = np.asarray(probs)
          probs = probs / probs.sum()
          bitstrings = [format(i, f'0{m}b') for i in outcomes]
          fig = go.Figure(go.Bar(
              x=outcomes, y=probs, customdata=bitstrings,
              hovertemplate='m=%{x}<br>binary=%{customdata}<br>P=%{y:.4f}<extra></extra>'
          ))
          nearest = int(round(phi*M)) % M
          fig.add_vline(x=nearest, line_dash='dash', annotation_text='nearest m/2^m')
          fig.update_layout(
              title=f'QPE output distribution for φ={phi} with m={m} control qubits',
              xaxis=dict(title='Measured bit string', tickmode='array', tickvals=outcomes, ticktext=bitstrings),
              yaxis_title='Probability',
          )
          save(fig, 'qpe-probability', 1050, 620)

          # 8. Hybrid VQA loop.
          nodes = {
              'Parameters θ': (.12,.70),
              'Quantum circuit U(θ)': (.40,.70),
              'Measurements / cost Ĉ': (.72,.70),
              'Classical optimizer': (.72,.28),
              'Updated θ′': (.40,.28),
          }
          fig = go.Figure()
          for name, (xx,yy) in nodes.items():
              fig.add_shape(type='rect', x0=xx-.105, x1=xx+.105, y0=yy-.06, y1=yy+.06, line=dict(width=1.5))
              fig.add_annotation(x=xx, y=yy, text=name, showarrow=False)
          edges = [
              ((.225,.70),(.295,.70)),
              ((.505,.70),(.615,.70)),
              ((.72,.64),(.72,.34)),
              ((.615,.28),(.505,.28)),
              ((.40,.34),(.40,.64)),
          ]
          for (x0,y0),(x1,y1) in edges:
              fig.add_annotation(x=x1, y=y1, ax=x0, ay=y0, xref='x', yref='y', axref='x', ayref='y', text='', showarrow=True, arrowhead=2)
          fig.update_layout(
              title='Hybrid quantum–classical variational loop',
              xaxis=dict(visible=False, range=[0,1]), yaxis=dict(visible=False, range=[.12,.84]), showlegend=False,
          )
          save(fig, 'vqa-hybrid-loop', 1000, 620)

          # 9. QML taxonomy.
          qml_labels = [
              'Quantum Machine Learning', 'Variational QML', 'Quantum kernels', 'Structured models',
              'Generative QML', 'Reservoir computing', 'Reinforcement learning',
              'Learning from quantum data', 'Quantum learning theory'
          ]
          qml_parents = [''] + ['Quantum Machine Learning'] * 8
          qml_values = [8] + [1] * 8
          fig = go.Figure(go.Sunburst(labels=qml_labels, parents=qml_parents, values=qml_values, branchvalues='total'))
          fig.update_layout(title='Major families of quantum machine learning')
          save(fig, 'qml-taxonomy', 900, 760)

          # 10. Classical-data QML versus quantum-data learning.
          fig = go.Figure()
          rows = [
              (.70, ['Classical data x','Encoding Uφ(x)','Quantum model','Measurement','Prediction']),
              (.28, ['Quantum state/process','Quantum model','Measurement','Prediction']),
          ]
          for yy, row in rows:
              xs = np.linspace(.08,.92,len(row))
              for xx, label in zip(xs,row):
                  fig.add_shape(type='rect', x0=xx-.095, x1=xx+.095, y0=yy-.065, y1=yy+.065, line=dict(width=1.4))
                  fig.add_annotation(x=xx, y=yy, text=label, showarrow=False)
              for i in range(len(xs)-1):
                  fig.add_annotation(
                      x=xs[i+1]-.095, y=yy, ax=xs[i]+.095, ay=yy,
                      xref='x', yref='y', axref='x', ayref='y', text='', showarrow=True, arrowhead=2
                  )
          fig.add_annotation(x=.5, y=.89, text='<b>Classical-data QML</b>', showarrow=False)
          fig.add_annotation(x=.5, y=.47, text='<b>Quantum-data learning</b>', showarrow=False)
          fig.update_layout(
              title='Two different starting points for QML',
              xaxis=dict(visible=False, range=[-.03,1.03]), yaxis=dict(visible=False, range=[.12,.98]), showlegend=False,
          )
          save(fig, 'qml-classical-vs-quantum-data', 1100, 620)

          # Figure documentation.
          (figdir / 'README.md').write_text('''# Educational Figures

The figures in this directory are generated with **Plotly** for the educational chapters in this repository.

- PNG files are used inside GitHub Markdown for reliable rendering.
- Interactive Plotly HTML versions are stored in [`../interactive/`](../interactive/).
- The interactive files are intended for a future GitHub Pages version of the textbook.

Figures should explain a concept that is difficult to communicate with equations or prose alone; decorative graphics are intentionally avoided.
''', encoding='utf-8')

          def insert_after(path, anchor, block, marker):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if marker in text:
                  return
              if anchor not in text:
                  raise RuntimeError(f'Anchor not found in {path}: {anchor[:80]}')
              p.write_text(text.replace(anchor, anchor + '\n\n' + block, 1), encoding='utf-8')

          def figure_block(rel, alt, caption):
              return f'''<p align="center">
  <img src="{rel}" alt="{alt}" width="820">
</p>
<p align="center"><em>{caption}</em></p>'''

          # Bloch sphere chapter: three complementary visualizations.
          insert_after(
              '01-foundations/04-bloch-sphere.md',
              'The Bloch sphere is therefore not merely a visualization trick. It is the geometric representation of the projective state space of one pure qubit.',
              figure_block('../assets/figures/bloch-sphere-state.png', 'Bloch sphere with a pure qubit state vector', 'A pure qubit is represented by a unit Bloch vector whose Cartesian coordinates are the Pauli expectation values.'),
              'bloch-sphere-state.png',
          )
          insert_after(
              '01-foundations/04-bloch-sphere.md',
              'center              → maximally mixed state I/2',
              figure_block('../assets/figures/bloch-ball-pure-mixed.png', 'Bloch ball showing pure, mixed, and maximally mixed states', 'Pure states lie on the surface; mixed states lie inside the Bloch ball; the maximally mixed state is at the origin.'),
              'bloch-ball-pure-mixed.png',
          )
          insert_after(
              '01-foundations/04-bloch-sphere.md',
              'This geometric form of the Born rule is one of the most useful single-qubit intuitions.',
              figure_block('../assets/figures/measurement-bases-bloch.png', 'Bloch sphere showing X and Z measurement directions', 'A measurement basis corresponds to an axis on the Bloch sphere; outcome probabilities depend on the angle between the state and measurement direction.'),
              'measurement-bases-bloch.png',
          )

          insert_after(
              '01-foundations/05-composite-systems.md',
              'The notation\n\n```math\n|ab\\rangle\n```\n\nis shorthand for\n\n```math\n|a\\rangle\\otimes|b\\rangle.\n```',
              figure_block('../assets/figures/tensor-product-basis.png', 'Grid of the four two-qubit computational basis states', 'The tensor product of two two-dimensional qubit spaces produces four computational basis states.'),
              'tensor-product-basis.png',
          )

          insert_after(
              '01-foundations/06-entanglement.md',
              'while\n\n```math\n\\langle X\\otimes X\\rangle_{\\rho_{\\mathrm{cc}}}=0.\n```',
              figure_block('../assets/figures/bell-correlations.png', 'Heatmaps comparing a classically correlated mixture with a Bell state in Z and X bases', 'The Bell state and a classical correlated mixture have the same Z-basis populations, but they behave differently in the X basis. Correlation in one basis is therefore not enough to diagnose entanglement.'),
              'bell-correlations.png',
          )

          insert_after(
              '04-quantum-algorithms/02-grover.md',
              'The product of two reflections is a rotation. In the good-bad plane, one Grover iteration rotates the state by angle\n\n```math\n2\\theta\n```\n\ntoward the good subspace.',
              figure_block('../assets/figures/grover-rotation.png', 'Geometric rotation picture of Grover search', 'Grover search stays in a two-dimensional subspace: each iterate rotates amplitude from the bad direction toward the good direction.'),
              'grover-rotation.png',
          )

          insert_after(
              '04-quantum-algorithms/03-phase-estimation.md',
              'Increasing $m$ narrows the phase resolution.',
              figure_block('../assets/figures/qpe-probability.png', 'Quantum phase estimation output distribution for a phase not exactly representable with four bits', 'When the phase is not exactly representable with the available control qubits, QPE produces a distribution concentrated near the closest binary estimates.'),
              'qpe-probability.png',
          )

          insert_after(
              '05-variational-quantum-algorithms/02-variational-principle.md',
              'This is an algorithmic framework, not a single algorithm.',
              figure_block('../assets/figures/vqa-hybrid-loop.png', 'Hybrid quantum classical variational optimization loop', 'The quantum device estimates a cost, the classical optimizer updates parameters, and the cycle repeats until a stopping criterion is reached.'),
              'vqa-hybrid-loop.png',
          )

          insert_after(
              '07-quantum-machine-learning/README.md',
              '| Quantum learning theory | Study fundamental learning resources and limits | Not architecture specific |',
              figure_block('../assets/figures/qml-taxonomy.png', 'Taxonomy of major quantum machine learning families', 'QML is a field containing several model and learning paradigms; it is not synonymous with variational quantum circuits.'),
              'qml-taxonomy.png',
          )

          insert_after(
              '07-quantum-machine-learning/01-what-is-qml.md',
              'Most real QML workflows are hybrid in some form.',
              figure_block('../assets/figures/qml-classical-vs-quantum-data.png', 'Comparison of classical-data QML and learning directly from quantum data', 'Classical-data QML requires an encoding step before quantum processing, whereas quantum-data learning begins with a state, channel, or process that is already quantum.'),
              'qml-classical-vs-quantum-data.png',
          )

          # Brief note in the landing page.
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          marker = '## Visual explanations'
          if marker not in text:
              anchor = '> **Format:** all scientific content is stored in Markdown (`.md`) files and rendered directly on GitHub.'
              block = '''## Visual explanations

Chapters use Plotly-generated figures when geometry, probability distributions, or computational flows are easier to understand visually. Static PNG versions render directly on GitHub; interactive Plotly HTML versions are kept under [`assets/interactive/`](assets/interactive/) for a future web edition.
'''
              if anchor not in text:
                  raise RuntimeError('README visual anchor not found')
              readme.write_text(text.replace(anchor, anchor + '\n\n' + block, 1), encoding='utf-8')
          PY

      - name: Commit generated figures and chapter updates
        run: |
          git config user.name "MaitHad"
          git config user.email "marwan.aithaddou@edu.uca.ac.ma"
          rm -f .github/workflows/add-plotly-educational-figures.yml
          git add -A
          git commit -m "Add Plotly educational figures" || exit 0
          git push
