<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600"><rect width="1120" height="600" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2a3f5f"/></marker></defs><g font-family="Arial,sans-serif" fill="#2a3f5f"><text x="40" y="42" font-size="22">Two different starting points for quantum machine learning</text><text x="65" y="112" font-size="16" font-weight="600">Classical-data QML</text><text x="65" y="345" font-size="16" font-weight="600">Learning from quantum data</text></g><g fill="#f7f9fc" stroke="#636efa" stroke-width="2"><rect x="65" y="145" width="150" height="70" rx="10"/><rect x="270" y="145" width="150" height="70" rx="10"/><rect x="475" y="145" width="150" height="70" rx="10"/><rect x="680" y="145" width="150" height="70" rx="10"/><rect x="885" y="145" width="150" height="70" rx="10"/></g><g fill="#f7f9fc" stroke="#00cc96" stroke-width="2"><rect x="65" y="378" width="205" height="70" rx="10"/><rect x="350" y="378" width="190" height="70" rx="10"/><rect x="620" y="378" width="180" height="70" rx="10"/><rect x="880" y="378" width="155" height="70" rx="10"/></g><g font-family="Arial,sans-serif" font-size="14" fill="#2a3f5f" text-anchor="middle"><text x="140" y="185">classical data x</text><text x="345" y="175">encoding</text><text x="345" y="196">U_phi(x)</text><text x="550" y="185">quantum model</text><text x="755" y="185">measurement</text><text x="960" y="185">prediction</text><text x="167" y="409">quantum state,</text><text x="167" y="430">channel, or process</text><text x="445" y="419">quantum model</text><text x="710" y="419">measurement</text><text x="957" y="419">prediction</text></g><g fill="none" stroke="#2a3f5f" stroke-width="2.4" marker-end="url(#a)"><path d="M215 180 H260"/><path d="M420 180 H465"/><path d="M625 180 H670"/><path d="M830 180 H875"/><path d="M270 413 H340"/><path d="M540 413 H610"/><path d="M800 413 H870"/></g><text x="560" y="525" font-family="Arial,sans-serif" font-size="13" fill="#2a3f5f" text-anchor="middle">Classical-data QML requires an encoding step; quantum-data learning begins with an object that is already quantum.</text></svg>